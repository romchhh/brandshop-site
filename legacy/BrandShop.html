<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BrandShop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: quiet gallery-style storefront. Dark editorial hero, light catalogue, one oxblood accent used only for sale and primary action. */
:root{
  --bg:#f3f3f1; --surface:#ffffff; --fg:#121316; --mut:#6b6d72; --line:#dcdcd8; --ph:#e7e7e3;
  --accent:#5b1f27; --accent-fg:#ffffff; --sale:#8c2f39;
  --hero-bg:#141518; --hero-fg:#f1f0ec; --hero-mut:#9a9ca2;
  --f-body:'Jost','Helvetica Neue',Arial,sans-serif; --f-accent:'Instrument Serif','Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --surface:#17181b; --fg:#ecebe8; --mut:#9a9ca2; --line:#2a2b2f; --ph:#1d1e22;
  --accent:#c0707a; --accent-fg:#141518; --sale:#d98a93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17181b; --fg:#ecebe8; --mut:#9a9ca2; --line:#2a2b2f; --ph:#1d1e22;
  --accent:#c0707a; --accent-fg:#141518; --sale:#d98a93; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:300}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-weight:300;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:400}
.ann{background:var(--hero-bg);color:var(--hero-fg);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:9px 16px}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;gap:16px}
.nav{display:flex;gap:28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.nav a{padding:6px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a.on{border-color:var(--fg)}
.logo{font-size:20px;letter-spacing:.42em;font-weight:400;text-transform:uppercase;padding-left:.42em}
.tools{display:flex;justify-content:flex-end;gap:6px}
.ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:var(--bg)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
.cnt{position:absolute;top:3px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:500;display:grid;place-items:center;padding:0 4px}
.cnt[hidden]{display:none}
.burger{display:none}
.sbar{border-top:1px solid var(--line);background:var(--surface)}
.sbar form{display:flex;gap:12px;align-items:center;height:56px}
.sbar input{flex:1;min-width:0;border:0;background:none;font-size:18px;outline:0}
@media(max-width:860px){
  .hdr .in{grid-template-columns:auto 1fr auto;height:56px}
  .nav{display:none}.burger{display:grid}
  .logo{text-align:center;font-size:17px}
  .nav.open{display:flex;position:absolute;top:56px;left:0;right:0;background:var(--surface);flex-direction:column;gap:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
  .nav.open a{padding:14px 0;border-bottom:1px solid var(--line)}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 30px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;border:1px solid var(--fg);transition:background .2s,color .2s}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.btn.lite{border-color:var(--hero-fg);color:var(--hero-fg)}
.btn.lite:hover{background:var(--hero-fg);color:var(--hero-bg)}
.btn.block{width:100%}
.link{font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:3px;font-weight:400}
/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);overflow:hidden}
.hero .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center;padding-block:72px 0;min-height:620px}
.hero .txt{padding-bottom:72px}
.hero .eyebrow{color:var(--hero-mut)}
.hero h1{font-size:clamp(44px,6.4vw,92px);line-height:.98;font-weight:200;margin:22px 0 26px;letter-spacing:-.01em}
.hero h1 em{font-family:var(--f-accent);font-weight:400;letter-spacing:0}
.hero p{max-width:420px;color:var(--hero-mut);margin:0 0 36px;font-size:16px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;align-self:end}
.hero .pics .ph{background:#202125;aspect-ratio:3/4.4}
.hero .pics .ph:nth-child(2){transform:translateY(-36px)}
.hero .pics .ph:nth-child(3){transform:translateY(-12px)}
@media(max-width:860px){
  .hero .in{grid-template-columns:1fr;gap:36px;padding-block:48px 0;min-height:0}
  .hero .txt{padding-bottom:0}
  .hero .pics{gap:10px}.hero .pics .ph:nth-child(2){transform:translateY(-20px)}.hero .pics .ph:nth-child(3){transform:none}
}
/* placeholders and images */
.ph{position:relative;background:var(--ph);overflow:hidden;display:grid;place-items:center}
.ph::after{content:attr(data-b);position:absolute;inset:auto 10px 12px;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);opacity:.7}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:transform .6s ease}
.ph img.bad{display:none}
/* sections */
.sec{padding-block:72px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-h h2{font-size:clamp(28px,3.4vw,42px);font-weight:200;margin-top:8px}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.cat{display:block}
.cat .ph{aspect-ratio:3/4}
.cat:hover img,.card:hover .ph img{transform:scale(1.04)}
.cat .nm{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.cat .nm span{color:var(--mut)}
@media(max-width:1100px){.cats{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.cats{grid-template-columns:repeat(2,1fr);gap:12px}}
.tabs{display:flex;gap:26px}
.tabs button{font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;color:var(--mut);font-weight:400}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 18px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.grid,.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.grid,.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px}}
.card{position:relative;display:block;min-width:0}
.card .ph{aspect-ratio:3/4}
.card .fav{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 82%,transparent)}
.card .fav svg,.pinfo .fav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.fav.on svg{fill:var(--accent);stroke:var(--accent)}
.badge{position:absolute;top:12px;left:12px;z-index:3;background:var(--sale);color:#fff;font-size:10px;letter-spacing:.14em;padding:4px 8px;font-weight:500}
.card .br{margin-top:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:400}
.card .tt{font-size:14px;margin:2px 0 6px;overflow-wrap:anywhere}
.price{font-weight:400;font-variant-numeric:tabular-nums}
.price s{color:var(--mut);font-weight:300;margin-left:8px}
.price b{color:var(--sale);font-weight:400}
.dots{display:flex;gap:5px;margin-top:8px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.band{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.band a{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--hero-bg);color:var(--hero-fg)}
.band .ph{position:absolute;inset:0;background:#202125}
.band .ph::after{display:none}
.band .ov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:28px;background:linear-gradient(to top,rgba(0,0,0,.62),transparent 60%)}
.band h3{font-size:clamp(24px,2.8vw,36px);font-weight:200;color:#fff}
.band a:hover img{transform:scale(1.04)}
.band .link{align-self:flex-start;color:#fff}
@media(max-width:700px){.band{grid-template-columns:1fr}}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:34px;margin-top:72px}
.vals h4{margin:0 0 6px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}
.vals p{margin:0;color:var(--mut)}
@media(max-width:700px){.vals{grid-template-columns:1fr;gap:20px}}
/* footer */
.ftr{margin-top:96px;background:var(--hero-bg);color:var(--hero-fg);padding-block:64px 28px}
.ftr .cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:40px}
.ftr h4{margin:0 0 16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;color:var(--hero-mut)}
.ftr li{list-style:none;margin:0 0 9px}.ftr ul{margin:0;padding:0}
.ftr a:hover{text-decoration:underline}
.ftr .big{font-size:22px;letter-spacing:.4em;text-transform:uppercase;font-weight:400}
.ftr form{display:flex;border-bottom:1px solid var(--hero-mut);margin-top:6px}
.ftr input{flex:1;min-width:0;background:none;border:0;padding:10px 0;outline:0;color:var(--hero-fg)}
.ftr form button{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.ftr .bot{margin-top:56px;padding-top:20px;border-top:1px solid #2a2b2f;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--hero-mut);font-size:12px}
@media(max-width:860px){.ftr .cols{grid-template-columns:1fr 1fr}.ftr .cols>div:first-child,.ftr .cols>div:last-child{grid-column:1/-1}}
/* catalog */
.crumbs{padding-block:22px 0;font-size:12px;color:var(--mut);letter-spacing:.06em}
.crumbs a:hover{color:var(--fg)}
.pg-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:18px 24px}
.pg-h h1{font-size:clamp(30px,4vw,48px);font-weight:200}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.sel{border:1px solid var(--line);background:var(--surface);height:40px;padding:0 12px;font-size:13px;min-width:0}
.fbtn{display:none;height:40px;padding:0 16px;border:1px solid var(--fg);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:5px 12px;font-size:12px}
.chip.clr{border:0;background:none;text-decoration:underline;color:var(--mut)}
.cat-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.fs{padding-block:18px;border-top:1px solid var(--line)}
.fs:first-child{border-top:0;padding-top:0}
.fs h4{margin:0 0 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.ck{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px;cursor:pointer}
.ck input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.ck span.n{margin-left:auto;color:var(--mut);font-size:12px}
.scroll{max-height:230px;overflow:auto}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);position:relative}
.sw button.on{outline:2px solid var(--fg);outline-offset:2px}
.sz{display:flex;gap:6px;flex-wrap:wrap}
.sz button{min-width:42px;height:36px;padding:0 8px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.sz button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sz button.dis{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.rng{display:grid;gap:10px}
.rng input[type=range]{width:100%;accent-color:var(--accent)}
.rng .v{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.empty{padding:80px 0;text-align:center;color:var(--mut)}
.empty h2{color:var(--fg);font-size:30px;margin-bottom:10px}
.empty .btn{margin-top:24px}
.drawer-x{display:none}
@media(max-width:900px){
  .cat-layout{grid-template-columns:1fr}
  .fbtn{display:inline-flex;align-items:center}
  .side{display:none}
  .cat-layout.open .side{display:block;position:fixed;inset:0;z-index:70;max-height:none;background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .drawer-x{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .cat-layout:not(.open) .drawer-x{display:none}
}
/* product */
.prod{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;padding-block:24px 0;align-items:start}
.prod .ph{aspect-ratio:3/4;max-width:100%}
.pinfo h1{font-size:clamp(26px,3vw,38px);font-weight:200;margin:10px 0 6px;overflow-wrap:anywhere}
.pinfo .price{font-size:22px;margin:14px 0 22px}
.pinfo .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin:22px 0 10px;display:flex;justify-content:space-between}
.pinfo .lbl span{color:var(--mut);font-weight:300;letter-spacing:.04em;text-transform:none;font-size:13px}
.pinfo .buy{display:flex;gap:10px;margin-top:26px}
.pinfo .buy .btn{flex:1}
.pinfo .fav{width:48px;height:48px;border:1px solid var(--fg);display:grid;place-items:center}
.err{color:var(--sale);font-size:13px;min-height:20px;margin-top:8px}
details{border-top:1px solid var(--line);padding:16px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+"}details[open] summary::after{content:"–"}
summary::-webkit-details-marker{display:none}
details p{margin:12px 0 0;color:var(--mut)}
@media(max-width:860px){.prod{grid-template-columns:1fr;gap:28px}}
/* cart + checkout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start;padding-block:8px 0}
@media(max-width:960px){.two{grid-template-columns:1fr;gap:36px}}
.li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;padding-block:20px;border-top:1px solid var(--line)}
.li:last-child{border-bottom:1px solid var(--line)}
.li .ph{aspect-ratio:3/4}
.li .nm{overflow-wrap:anywhere}
.li .meta{color:var(--mut);font-size:13px;margin-top:2px}
.li .right{text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:12px}
.qty{display:inline-flex;border:1px solid var(--line);background:var(--surface)}
.qty button{width:34px;height:34px;font-size:16px}
.qty span{width:34px;display:grid;place-items:center;font-size:14px}
.rm{font-size:12px;color:var(--mut);text-decoration:underline}
.sum{background:var(--surface);padding:28px;border:1px solid var(--line);position:sticky;top:calc(88px + env(safe-area-inset-top,0px))}
.sum h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin-bottom:18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-variant-numeric:tabular-nums}
.row.t{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:18px;font-weight:400}
.row .m{color:var(--mut)}
.frm{display:grid;gap:18px}
.frm .g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:560px){.frm .g2{grid-template-columns:1fr}}
.fld label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;font-weight:400}
.fld input,.fld textarea{width:100%;height:48px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:0}
.fld textarea{height:84px;padding:12px 14px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--fg)}
.fld.bad input{border-color:var(--sale)}
.fld .e{color:var(--sale);font-size:12px;margin-top:4px;min-height:0}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);padding:14px 16px;cursor:pointer}
.opt input{accent-color:var(--accent);margin-top:4px}
.opt small{display:block;color:var(--mut);font-size:13px}
.opt:has(input:checked){border-color:var(--fg)}
.h3s{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin:34px 0 14px}
.h3s:first-child{margin-top:0}
.done{max-width:520px;margin:0 auto;padding:90px 0 0;text-align:center}
.done h1{font-size:40px;font-weight:200;margin:12px 0}
.done p{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:14px 20px;display:flex;gap:18px;align-items:center;z-index:90;font-size:14px;transition:.25s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{text-decoration:underline;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

function match(p,skip){

  if(skip!=='brands'&&F.brands.length&&F.brands.indexOf(p.b)<0)return false;
  if(skip!=='colors'&&F.colors.length&&!p.col.some(function(c){return F.colors.indexOf(c)>-1}))return false;
  if(skip!=='sizes'&&F.sizes.length&&!p.s.some(function(s){return F.sizes.indexOf(s)>-1}))return false;
  if(p.ps<F.min||p.ps>F.max)return false;
  if(F.sale&&!p.sale)return false;
  if(F.q){var h=(p.t+' '+p.b+' '+p.a+' '+CATS[p.c]).toLowerCase();var ws=F.q.toLowerCase().split(/\s+/);for(var i=0;i<ws.length;i++){if(h.indexOf(ws[i])<0)return false}}
  return true
}
function sorted(list){
  var a=list.slice();
  if(F.sort==='new')a.sort(function(x,y){return y.id-x.id});
  if(F.sort==='asc')a.sort(function(x,y){return x.ps-y.ps});
  if(F.sort==='desc')a.sort(function(x,y){return y.ps-x.ps});

function summaryH(btn){
  var s=cartSum();
  return '<aside class="sum"><h3>Ваше замовлення</h3><div class="row"><span class="m">Товари ('+cartCount()+')</span><span>'+money(s)+'</span></div><div class="row"><span class="m">Доставка</span><span>за тарифами перевізника</span></div><div class="row t"><span>Разом</span><span>'+money(s)+'</span></div>'+btn+'</aside>'
}
function viewCart(){
  $root.innerHTML=header({name:'cart'})+'<main class="wrap"><div class="crumbs"><a href="#home">Головна</a> / Кошик</div><div class="pg-h"><div><div class="eyebrow">Покупки</div><h1>Кошик</h1></div></div>'+
  (cart.length?'<div class="two"><div>'+cart.map(function(l){return lineH(l,true)}).join('')+'<div style="margin-top:22px"><a class="link" href="#catalog" data-act="keep">Продовжити покупки</a></div></div>'+summaryH('<a class="btn solid block" style="margin-top:20px" href="#checkout">Оформити замовлення</a>')+'</div>':'<div class="empty"><h2>Кошик порожній</h2><p>Додайте товари з каталогу, щоб оформити замовлення.</p><a class="btn solid" href="#catalog" data-act="allcat">До каталогу</a></div>')+'</main>'+footer();
}
function fld(id,label,type,ph2,extra){return '<div class="fld" id="w-'+id+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" placeholder="'+(ph2||'')+'" '+(extra||'')+'><div class="e"></div></div>'}
function viewCheckout(){
  if(!cart.length){location.hash='cart';return}
  $root.innerHTML=header({name:'checkout'})+'<main class="wrap"><div class="crumbs"><a href="#home">Головна</a> / <a href="#cart">Кошик</a> / Оформлення</div><div class="pg-h"><div><div class="eyebrow">Останній крок</div><h1>Оформлення</h1></div></div>'+
  '<div class="two"><form id="co" class="frm" novalidate><div class="h3s">Контакти</div><div class="g2">'+fld('fn','Ім’я та прізвище','text','Олександр Коваленко','autocomplete="name"')+fld('ph','Телефон','tel','+380 __ ___ __ __','autocomplete="tel"')+'</div>'+fld('em','Email (необов’язково)','email','name@mail.com','autocomplete="email"')+
  '<div class="h3s">Доставка</div><label class="opt"><input type="radio" name="dl" value="np" checked><span>Нова Пошта, відділення<small>Забрати у вибраному відділенні</small></span></label><label class="opt"><input type="radio" name="dl" value="cr"><span>Нова Пошта, кур’єр<small>Доставка за вказаною адресою</small></span></label><label class="opt"><input type="radio" name="dl" value="up"><span>Укрпошта<small>Відділення зв’язку</small></span></label>'+
  '<div class="g2">'+fld('ct','Місто','text','Київ','autocomplete="address-level2"')+fld('ad','Відділення або адреса','text','Відділення №12','autocomplete="street-address"')+'</div>'+
  '<div class="h3s">Оплата</div><label class="opt"><input type="radio" name="pm" value="cod" checked><span>При отриманні<small>Готівкою або карткою у відділенні</small></span></label><label class="opt"><input type="radio" name="pm" value="card"><span>Карткою онлайн<small>Visa, Mastercard, Apple Pay, Google Pay</small></span></label>'+
  '<div class="fld"><label for="cm">Коментар до замовлення</label><textarea id="cm" placeholder="Побажання щодо розміру чи доставки"></textarea></div></form>'+
  summaryH(cart.map(function(l){return lineH(l,false)}).join('').replace(/class="li"/g,'class="li" style="grid-template-columns:64px minmax(0,1fr) auto;gap:12px;padding-block:12px"')+'<button class="btn solid block" style="margin-top:20px" data-act="place">Підтвердити замовлення</button><p style="color:var(--mut);font-size:12px;margin:12px 0 0">Це прототип: дані нікуди не надсилаються.</p>')+'</div></main>'+footer();
}
function viewDone(n){
  $root.innerHTML=header({name:'done'})+'<main class="wrap"><div class="done"><div class="eyebrow">Замовлення №'+n+'</div><h1>Дякуємо!</h1><p>Ми отримали ваше замовлення та зв’яжемось для підтвердження.</p><a class="btn solid" style="margin-top:28px" href="#home">На головну</a></div></main>'+footer();
}
/* router */
function route(){var h=location.hash.replace('#','')||'home';var m=h.match(/^product-(\d+)$/);if(m)return {name:'product',id:+m[1]};return {name:h}}
function render(){
  var r=route();
  if(r.name==='catalog')viewCatalog();else if(r.name==='product')viewProduct(r.id);else if(r.name==='favorites')viewFav();else if(r.name==='cart')viewCart();else if(r.name==='checkout')viewCheckout();else viewHome();
  syncHdr();
}
function go(name){if(location.hash==='#'+name)render();else location.hash=name}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
document.addEventListener('error',function(e){if(e.target&&e.target.tagName==='IMG')e.target.classList.add('bad')},true);
/* events */
function remove(arr,v){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1)}
function toggleIn(arr,v){if(arr.indexOf(v)>-1)remove(arr,v);else arr.push(v)}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act],[data-f]');if(!b)return;
  var f=b.getAttribute('data-f');
  if(f){toggleIn(F[f],b.getAttribute('data-v'));F.page=1;updateCatalog();return}
  var a=b.getAttribute('data-act');
  if(a==='fav'){e.preventDefault();toggleFav(+b.getAttribute('data-fav'));return}
  if(a==='menu'){document.getElementById('nav').classList.toggle('open');return}
  if(a==='search'){var s=document.getElementById('sbar');s.hidden=!s.hidden;if(!s.hidden)document.getElementById('sq').focus();return}
  if(a==='allcat'||a==='keep'){F=newF();go('catalog');return}
  if(a==='sortnew'){F=newF();go('catalog');return}
  if(a==='onsale'){F=newF();F.sale=true;F.sort='disc';go('catalog');return}
  if(a==='gocat'){F=newF();F.cats=b.getAttribute('data-cats').split(',').map(Number);go('catalog');return}
  if(a==='tab'){homeTab=b.getAttribute('data-v');document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});document.getElementById('hgrid').innerHTML=tabItems().map(card).join('');return}
  if(a==='unchip'){var k=b.getAttribute('data-k'),v=b.getAttribute('data-v');if(k==='price'){F.min=MINP;F.max=MAXP}else if(k==='sale')F.sale=false;else if(k==='q')F.q='';else if(k==='cats')remove(F.cats,+v);else remove(F[k],v);F.page=1;updateCatalog();return}
  if(a==='reset'){F=newF();updateCatalog();return}
  if(a==='more'){F.page++;updateCatalog();return}
  if(a==='fopen'){document.getElementById('cl').classList.add('open');window.scrollTo(0,0);return}
  if(a==='fclose'){document.getElementById('cl').classList.remove('open');return}
  if(a==='pick'){selSize=b.getAttribute('data-v');document.querySelectorAll('#pz button').forEach(function(x){x.classList.toggle('on',x===b)});document.getElementById('err').textContent='';return}
  if(a==='add'){if(!selSize){document.getElementById('err').textContent='Оберіть розмір';return}addCart(+b.getAttribute('data-id'),selSize);toast('Додано в кошик <a href="#cart">Відкрити кошик</a>');return}
  if(a==='inc'||a==='dec'||a==='rm'){var id=+b.getAttribute('data-id'),sz=b.getAttribute('data-s');var l=cart.find(function(x){return x.id===id&&x.s===sz});if(l){if(a==='inc')l.qty++;else if(a==='dec')l.qty=Math.max(1,l.qty-1);else remove(cart,l);ss('bs_cart',cart);render()}return}
  if(a==='place'){placeOrder();return}
});
function placeOrder(){
  var ok=true;
  [['fn',function(v){return v.trim().length>=3},'Вкажіть ім’я та прізвище'],['ph',function(v){return v.replace(/\D/g,'').length>=10},'Вкажіть коректний телефон'],['ct',function(v){return v.trim().length>=2},'Вкажіть місто'],['ad',function(v){return v.trim().length>=2},'Вкажіть відділення або адресу']].forEach(function(r){
    var i=document.getElementById(r[0]),w=document.getElementById('w-'+r[0]);var good=r[1](i.value);w.classList.toggle('bad',!good);w.querySelector('.e').textContent=good?'':r[2];if(!good){if(ok)i.focus();ok=false}
  });
  if(!ok)return;
  var n=String(Math.floor(100000+Math.random()*900000));cart=[];ss('bs_cart',cart);viewDone(n);syncHdr();window.scrollTo(0,0)
}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute&&t.getAttribute('data-f')&&t.type==='checkbox'){var k=t.getAttribute('data-f');var v=k==='cats'?+t.value:t.value;toggleIn(F[k],v);F.page=1;updateCatalog();return}
  if(t.id==='fsale'){F.sale=t.checked;F.page=1;updateCatalog();return}
  if(t.id==='sort'){F.sort=t.value;F.page=1;updateCatalog();return}
  if(t.id==='rmin'||t.id==='rmax'){F.page=1;updateCatalog()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='rmin'||t.id==='rmax'){
    var lo=+document.getElementById('rmin').value,hi=+document.getElementById('rmax').value;
    if(t.id==='rmin'&&lo>hi){lo=hi;t.value=lo}if(t.id==='rmax'&&hi<lo){hi=lo;t.value=hi}
    F.min=lo;F.max=hi;document.getElementById('vmin').textContent=money(lo);document.getElementById('vmax').textContent=money(hi)
  }
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='sform'){F=newF();F.q=document.getElementById('sq').value.trim();go('catalog');return}
  if(f.getAttribute('data-act')==='sub'){var i=document.getElementById('subm');if(i.value.indexOf('@')>0){toast('Дякуємо, ми повідомимо про новинки');i.value=''}else{i.focus()}}
});
render();
})();
</script>

</body></html>
